<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Roblox Game Analytics</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<header>
<h1>Roblox Analytics</h1>
<div class="controls">
<input id="metricName" placeholder="metric name (e.g. players_online)" />
<select id="metricType"><option value="counter">counter</option><option value="gauge">gauge</option><option value="timer">timer</option></select>
<select id="minutes"><option>60</option><option>30</option><option>15</option><option>5</option></select>
<button id="refresh">Refresh</button>
</div>
</header>


<main>
<section class="card">
<canvas id="timeseriesChart"></canvas>
</section>
<section class="card" id="stats">
<h3>Summary</h3>
<div id="summary">No data</div>
</section>
</main>


<script src="app.js"></script>
</body>
</html>
